# 主机拟合模型 + IK + 关节流参数；不代表 ROKAE 官方逆解。


# 主机模型标识；不是从控制器下载的厂家标定模型。
name: xmate-er-pro-7
# 米；基座到肩部高度，拟合值，不是厂家 CAD/标定参数。
d_bs: 0.3418440082
# 米；肩到肘长度，拟合值。
d_se: 0.3937033048
# 米；肘到腕长度，拟合值。
d_ew: 0.3661117088
# 米；腕到模型 TCP 的固定轴向偏移；不能替代实际工具 TCP 标定。
d_wf: 0.2503110000

# 从 0 开始的 J2/J4/J6 索引；副任务远离零角的启发式，不是完整奇异性判定。
singular_joints: [1, 3, 5]

# 度；主机模型下界。真实关节流还与控制器软限位取交集；当前 IK 模型本身未同步该交集。
lower_deg: [-170, -120, -170, -120, -170, -120, -360]
# 度；主机模型上界；当前 ±170/120/360 与现场软限位不同，不得视为控制器设置。
upper_deg: [170, 120, 170, 120, 170, 120, 360]

# rad/s，各关节上限；IK 每步和 1 kHz 关节流都使用。
max_velocity: [1.2, 1.2, 1.5, 1.5, 2.0, 2.0, 2.0]
# rad/s²，1 kHz 关节流使用；IK 自身不是加速度约束优化器。
max_acceleration: [4.0, 4.0, 6.0, 6.0, 8.0, 8.0, 8.0]
# rad/s³，1 kHz 关节流使用。
max_jerk: [40.0, 40.0, 60.0, 60.0, 80.0, 80.0, 80.0]

# rad，固定零空间姿态参考；不随任务 home 或 e/c 自动改变，也不是动作命令。
neutral_position: [0.0, 0.35, 0.0, 1.85, 0.0, -0.6292036732051036, 1.5707963267948966]

# 仅 Pinocchio 路线的 1 kHz 关节参考滤波/断流限制。
stream:
  # Hz，关节目标低通截止频率。
  reference_cutoff_hz: 15.0
  # rad，关节目标死区。
  deadband: 0.0001
  # rad，允许的关节目标跳变量。
  max_target_delta: 0.35
  # 秒，原生关节流无新目标时 hold；不是 Python 的腕部 freshness 阈值。
  hold_timeout: 0.15
  # 秒，原生关节流无新目标时 safe_stop；显式 hold 与断流 watchdog 是不同状态。
  stop_timeout: 0.60
  # 秒，关节流拒绝过期来源时间戳。
  max_source_age: 0.20
  # 秒，关节流来源时间戳的未来偏差容忍。
  future_tolerance: 0.05

# 主机阻尼最小二乘微分 IK；每个新 Quest 腕部样本走一步，不在 1 kHz 回调里迭代。
ik:
  # 基础阻尼 λ；矩阵中加 λ²I，越大通常越稳但跟随误差也可能增大。
  damping: 0.05
  # 接近奇异时增大的阻尼上界。
  damping_max: 0.2
  # 最小奇异值低于此阈值时增加阻尼；平移/旋转混合雅可比未做尺度归一化。
  singular_sigma: 0.04
  # 副任务趋向 neutral_position 的增益。
  posture_gain: 1.2
  # 副任务远离模型关节限位的增益；不是硬约束。
  limit_gain: 4.0
  # 副任务推动 J2/J4/J6 离开零角的增益；不是保证全局无奇异。
  singularity_gain: 0.8
  # rad/s，副任务速度向量的整体范数上限；投影前限幅。
  null_max_speed: 0.6
  # rad，接近模型限位时开始排斥的距离。
  limit_margin: 0.17
  # m/s，将末端误差步长限制为速度×dt；与笛卡尔路线同名设置相互独立。
  max_translation_speed: 0.15
  # rad/s，将旋转误差步长限制为角速度×dt。
  max_angular_speed: 0.50
